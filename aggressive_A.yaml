# Aggressive experiment with normalization
train_node_csv: "dataset/2_0.0.csv,dataset/2_0.1.csv,dataset/2_0.2.csv,dataset/2.5_0.1.csv,dataset/3_0.0.csv,dataset/3_0.1.csv"
val_node_csv: "dataset/2.5_0.2.csv"
test_node_csv: "dataset/3_0.2.csv"
edge_csv: "dataset/edges_knn_k4.csv"

in_fields: "Density__kg_m3_,Eddy_Viscosity__Pa_s_,Pressure__Pa_,Static_Enthalpy__J_kg1_,Temperature__K_"
out_fields: "Pressure__Pa_,Velocity_u__m_s1_,Velocity_v__m_s1_,Velocity_w__m_s1_,Density__kg_m3_"

epochs: 60
pretrain_epochs: 5
batch_size: 1
num_workers: 0
lr: 3.0e-3
hidden_dim: 32
num_regions: 4
ode_steps: 2
ode_method: "rk4"
ode_t: 1.0
ode_rtol: null
ode_atol: null
device: "cuda"
lambda_flux: 5.0
lambda_vort: 0.1
lambda_smooth: 0.1
lr_schedule: "cosine"
early_stop_patience: 5
vel_indices: "1,2,3"
geom_type: "rbf"
geom_dim: 16
geom_gamma: null
flux_dim: 5
flux_nproj: 3
local_beta: 0.8
local_depth: 2
disable_flux: false
input_noise_std: 0.0
eval_noise_std: 0.0
normalize: true
norm_eps: 1e-6

seed: 0
deterministic: false
output_dir: "exp/aggressive/configA/seed0"
loss_csv: "exp/aggressive/configA/seed0/losses.csv"
ckpt: "exp/aggressive/configA/seed0/model.pt"

